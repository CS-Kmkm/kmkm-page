name: E2E Tests

on:
  push:
    branches: [main, develop, test]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '22.x'

    - name: Enable Corepack
      run: corepack enable

    - name: Install dependencies
      run: corepack pnpm install --frozen-lockfile

    - name: Install fonts
      run: |
        sudo apt-get update
        sudo apt-get install -y fonts-noto-cjk fonts-noto-color-emoji

    - name: Install Playwright browsers
      run: corepack pnpm exec playwright install --with-deps chromium

    - name: Build application
      run: corepack pnpm build
      env:
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
        NEXT_PUBLIC_SITE_NAME: Personal Portfolio

    - name: Run E2E tests
      run: corepack pnpm exec playwright test --project=chromium
      env:
        PLAYWRIGHT_TEST_BASE_URL: http://localhost:3000

    - name: Upload test results
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 7

    - name: Upload test videos
      uses: actions/upload-artifact@v6
      if: failure()
      with:
        name: playwright-videos
        path: test-results/
        retention-days: 7

  analytics-security:
    name: Analytics Security E2E
    runs-on: ubuntu-latest
    env:
      # Synthetic public config; requests are intercepted by the security tests.
      NEXT_PUBLIC_GA_ID: G-AUDIT123
      NEXT_PUBLIC_ANALYTICS_ENDPOINT: https://metrics.example.test/vitals
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_NAME: Personal Portfolio
      PLAYWRIGHT_TEST_BASE_URL: http://localhost:3000

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '22.x'

    - name: Enable Corepack
      run: corepack enable

    - name: Install dependencies
      run: corepack pnpm install --frozen-lockfile

    - name: Install Playwright browser
      run: corepack pnpm exec playwright install --with-deps chromium

    - name: Build analytics-enabled application
      run: corepack pnpm build

    - name: Run analytics security regression tests
      run: corepack pnpm exec playwright test e2e/security.spec.ts --project=chromium

    - name: Upload analytics security results
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: analytics-security-report
        path: |
          playwright-report/
          test-results/
        retention-days: 7
