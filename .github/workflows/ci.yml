name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, test]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}

    - name: Enable Corepack
      run: corepack enable

    - name: Install dependencies
      run: corepack pnpm install --frozen-lockfile

    - name: Run ESLint
      run: corepack pnpm lint

    - name: Run TypeScript type check
      run: corepack pnpm type-check

    - name: Validate data files
      run: corepack pnpm validate-data

    - name: Run tests
      run: corepack pnpm test

    - name: Upload test coverage
      uses: codecov/codecov-action@v5
      if: success()
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '22.x'

    - name: Enable Corepack
      run: corepack enable

    - name: Install dependencies
      run: corepack pnpm install --frozen-lockfile

    - name: Build application
      run: corepack pnpm build
      env:
        NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://portfolio.vercel.app' }}
        NEXT_PUBLIC_SITE_NAME: ${{ secrets.NEXT_PUBLIC_SITE_NAME || 'Personal Portfolio' }}

    - name: Upload build artifacts
      uses: actions/upload-artifact@v6
      with:
        name: build-files
        path: |
          .next/
          package.json
          pnpm-lock.yaml
        retention-days: 1
        compression-level: 6

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '22.x'

    - name: Enable Corepack
      run: corepack enable

    - name: Install dependencies
      run: corepack pnpm install --frozen-lockfile

    - name: Run security audit
      run: corepack pnpm audit --audit-level=moderate

    - name: Run Snyk security scan
      uses: snyk/actions/node@master
      continue-on-error: true
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=high

  lighthouse:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'pull_request'

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '22.x'

    - name: Enable Corepack
      run: corepack enable

    - name: Install dependencies
      run: corepack pnpm install --frozen-lockfile

    - name: Build application
      run: corepack pnpm build
      env:
        NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://portfolio.vercel.app' }}
        NEXT_PUBLIC_SITE_NAME: ${{ secrets.NEXT_PUBLIC_SITE_NAME || 'Personal Portfolio' }}

    - name: Run Lighthouse CI
      uses: treosh/lighthouse-ci-action@v12
      with:
        configPath: './.lighthouserc.json'
        uploadArtifacts: true
        temporaryPublicStorage: true
      env:
        PORT: 3000
